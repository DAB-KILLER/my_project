
name: Gitleaks secret detection

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:

  gileaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull Gitleaks Docker image
        run: docker pull securecodebox/gitleaks:v7.3.0
      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            securecodebox/gitleaks:v7.3.0 \
            --path=/repo \
            --verbose
