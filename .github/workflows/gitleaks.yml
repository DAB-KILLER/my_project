
name: Gitleaks secret detection

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:

  gileaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull Gitleaks Docker image
        run: docker pull securecodebox/gitleaks:v7.3.0
      - name: Run Gitleaks
        run: |

          mkdir -p reports

          docker run --rm \
          -v "${{ github.workspace }}:/repo" \
          securecodebox/gitleaks:v7.3.0 \
          --path=/repo \
          --verbose \
          --report=/repo/reports/gitleaks.json \
          --report-format=json

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: reports/gitleaks.json
