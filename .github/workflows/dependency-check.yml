name: Owasp dependency check
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
 dependency-check:
  runs-on: ubuntu-latest
  steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull dependency check image
        run: docker pull owasp/dependency-check

      - name: Create reports folder
        run: mkdir -p reports

      - name: remove old corrupt database
        run: rm -rf dependency-check-data

      - name: Cache dependency check database
        uses: actions/cache@v4
        with:
            path: dependency-check-data
            key: dependency-check-data

      - name: Owasp Dependency check
        run: |
          docker run --rm \
          -e NVD_API_KEY="${{ secrets.NVD_API_KEY }} " \
          -v "${{ github.workspace }}:/src" \
          -v "${{ github.workspace }}/dependency-check-data:/usr/share/dependency-check/data" \
          -v "${{ github.workspace }}/reports:/report" \
          owasp/dependency-check:latest \
          --scan /src \
          --format HTML \
          --out /report \
          --nvdApiKey "${NVD_API_KEY}" \
          --failOnCVSS 7
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
         name: dependency-check-report
         path: reports/
