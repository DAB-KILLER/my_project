name : Semgrep security scan
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Pull semgrep Docker image
        run: docker pull semgrep/semgrep:canary-nonroot semgrep
      - name: Run semgrep
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            semgrep/semgrep:canary-nonroot semgrep \
            semgrep --config=auto --error


