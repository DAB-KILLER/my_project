name : Semgrep security scan
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Pull semgrep Docker image
        run: docker pull semgrep/semgrep:canary-nonroot
      - name: Run semgrep
        run: |

            docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            semgrep/semgrep:canary-nonroot \
            semgrep --config=auto --error --json \
            --output=semgrep-report.json /src

      - name: Upload semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json

