name: Trivy container image Scan
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  Trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build docker image
        run: |
          docker build -t my_project_py:latest .

      - name: Pull Trivy Docker image
        run: docker pull aquasec/trivy:latest

      - name: Create reports folder
          run: |
            mkdir -p reports

      - name: Run Trivy scan and save report
        run: |
          docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v "${{ github.workspace }}/reports:/reports" \
          aquasec/trivy:latest image \
          --severity HIGH,CRITICAL \
          --format table \
          --output /reports/trivy-report.txt \
          --exit-code 1 \
          my_project_py:latest

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
           name: trivy-report
           path: /reports/trivy-report.txt
