name: Bandit Security Scan



on:

  push:

    branches:

      - main



  pull_request:

    branches:

      - main



jobs:

  bandit:

    runs-on: ubuntu-latest



    steps:

      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Pull Bandit Docker image

        run: docker pull cytopia/bandit:latest-py3.8


      - name: Run Bandit

        run: |

          docker run --rm \

            -v "${{ github.workspace }}:/src" \

            -w /src \

            ghcr.io/pycqa/bandit/bandit:latest \

            -r .
            --severity-level high
