name: Bandit Security Scan
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Pull Bandit Docker image
        run: docker pull cytopia/bandit:latest-py3.8
      - name: Run Bandit
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            cytopia/bandit:latest-py3.8 \
            -r . -f json -o /src/bandit-report.json \
            --severity-level high

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
