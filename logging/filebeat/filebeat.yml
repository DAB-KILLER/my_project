filebeat.inputs:
  - type: filestream
    id: docker-container-logs
    paths:
    - /var/lib/docker/containers/*/*.log
    parsers:
    - container: ~
    processors:
    - add_docker_metadata:
        host: unix:///var/run/docker.sock
    fields:
      source_type: application
    fields_under_root: true
output.logstash:
  hosts:
    - "logstash:5044"
